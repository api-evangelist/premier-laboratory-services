name: Premier Laboratory Services
description: Premier Laboratory Services is a locally-owned clinical diagnostics laboratory
  based in Scott, Louisiana, providing testing services to healthcare facilities and
  providers. Its menu includes LCMS-MS drug testing, PCR testing (respiratory, UTI,
  STD, women's health, and wound), and blood/clinical chemistry testing, with more than
  200 tests available and an advertised 24-hour average turnaround. The company emphasizes
  local representatives and personalized service, and offers a patient results portal. It
  is surfaced in the API Evangelist network as a portfolio company of Canaan Partners. As of
  this profile the company publishes no public developer program, API, or documentation.
